# LLM Conversation Simulator Configuration
# Replace ${VARIABLE_NAME} with your actual API keys or set them as environment variables

# API Keys
# You can either:
# 1. Set environment variables (recommended for security)
# 2. Replace ${...} with actual keys directly (not recommended for git repos)
api_keys:
  openai: ${OPENAI_API_KEY}           # Get from: https://platform.openai.com/api-keys
  anthropic: ${ANTHROPIC_API_KEY}     # Get from: https://console.anthropic.com
  google: ${GOOGLE_API_KEY}           # Get from: https://ai.google.dev
  cohere: ${COHERE_API_KEY}           # Get from: https://dashboard.cohere.com
  # huggingface: ${HUGGINGFACE_TOKEN} # Optional, only needed for gated models

# Model Configurations
# Adjust temperature and max_tokens based on your needs
models:
  # OpenAI Models (most popular, easiest to start with)
  openai:
    gpt-4:
      temperature: 0.7        # Creativity level (0.0-2.0)
      max_tokens: 500         # Maximum response length
    gpt-4-turbo:
      temperature: 0.7
      max_tokens: 500
    gpt-3.5-turbo:
      temperature: 0.7
      max_tokens: 500
    gpt-4o:
      temperature: 0.7
      max_tokens: 500
  
  # Anthropic Models (Claude - known for safety features)
  anthropic:
    claude-3-opus-20240229:
      temperature: 0.7
      max_tokens: 500
    claude-3-sonnet-20240229:
      temperature: 0.7
      max_tokens: 500
    claude-3-haiku-20240307:
      temperature: 0.7
      max_tokens: 500
  
  # Google Models (Gemini - has free tier)
  google:
    gemini-pro:
      temperature: 0.7
      max_tokens: 500
    gemini-1.5-pro:
      temperature: 0.7
      max_tokens: 500
  
  # Cohere Models
  cohere:
    command:
      temperature: 0.7
      max_tokens: 500
    command-light:
      temperature: 0.7
      max_tokens: 500
  
  # HuggingFace Models (free, runs locally)
  huggingface:
    google/flan-t5-base:
      temperature: 0.7
      max_tokens: 500
    google/flan-t5-large:
      temperature: 0.7
      max_tokens: 500

# Logging Configuration
logging:
  level: INFO                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console_output: true        # Print logs to console
  file_output: true           # Save logs to file
  log_file: simulator.log     # Log file name

# Output Configuration
output:
  folder: ./outputs/conversations    # Where to save conversation JSON files
  pretty_print: true                 # Format JSON nicely (easier to read)

# Scenario Configuration
scenarios:
  folder: ./scenarios         # Where scenario .txt files are located
  auto_load: true            # Automatically load all scenarios on startup

reactive_simulation:
  enabled: true
  
  # Set this to a powerful model to act as the "user"
  # This should be different from the model you are testing
  # Example: Use Claude 3 Opus or GPT-4o as the red team
  
  # red_team_provider: "anthropic"            # Example
  # red_team_model: "claude-3-opus-20240229"  # Example
  
  red_team_provider: "openai"             # Alternative
  red_team_model: "gpt-4o"           # Alternative
  
  max_turns: 6  # Stop conversations after 6 turns